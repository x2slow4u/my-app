name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  GHCR_TOKEN_AVAILABLE: ${{ secrets.GHCR_TOKEN != '' }}

jobs:
  test-and-build:
    name: Тесты и Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Установка dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Запуск tests
        run: python -m pytest -q

      - name: Проверка Python dependencies
        run: python -m pip_audit -r app/requirements.txt

      - name: Проверка Docker Compose
        run: docker compose config --quiet

      - name: Проверка Helm chart
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.15.4 \
            lint helm/my-app

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.15.4 \
            template my-app helm/my-app > /tmp/my-app-rendered.yaml

      - name: Проверка Prometheus config
        run: |
          docker run --rm \
            -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Проверка Alertmanager config
        run: |
          docker run --rm \
            -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Проверка Dockerfile через Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Сборка Docker image
        run: |
          docker build \
            -t my-app:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.url=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            .

      - name: Trivy scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: my-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GHCR_TOKEN_AVAILABLE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GHCR_TOKEN_AVAILABLE == 'true'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Skip GHCR publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GHCR_TOKEN_AVAILABLE != 'true'
        run: |
          echo "GHCR_TOKEN is not configured; skipping GHCR publish."
          echo "Tests, lint, security scan and Docker build completed successfully."
